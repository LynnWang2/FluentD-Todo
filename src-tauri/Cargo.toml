[package]
name = "fluent-md-todo"
version = "1.3.1"
description = "轻量的 Markdown 待办清单"
authors = ["Fluent MD Todo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fluent_md_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-autostart = "2"
objc2 = "0.6"

