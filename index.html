// Opacity Slider
const opacitySlider = document.getElementById("opacitySlider");
// The slider sets a target; a rAF loop eases the painted value toward it,
// so dragging feels like the glass itself is settling, not jumping.
let opacityShown = null;
let opacityTarget = null;
let opacityRaf = 0;
function paintOpacity(val) {
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty("--bg-alpha", val.toFixed(2));
  rootStyle.setProperty("--card-alpha", Math.min(0.95, val + 0.08).toFixed(2));
  // Cool wash over the backdrop: fills exactly the share not covered by the
  // window surface, so sliding changes lightness, not hue.
  const covered = val * val * 0.97;
  rootStyle.setProperty("--wash-alpha", ((1 - covered) * 0.30).toFixed(3));
  // Legibility compensation: below a surface opacity of 64 the glass gets
  // clearer than the ink tiers were tuned for — over a see-through surface
  // their effective opacity multiplies down and elements wash out. So from
  // 64 down to the slider minimum (35) every ink alpha is raised in
  // proportion toward its cap: text tiers and the slider can reach 1, the
  // disabled gray caps at 0.50 so it never reads as clickable, borders cap
  // lower (they are hairlines, not content). Stepless: recomputed from the
  // eased value on every animation frame.
  const t = Math.min(1, Math.max(0, (0.64 - val) / (0.64 - 0.35)));
  const boost = (base, cap) => (base + (cap - base) * t).toFixed(3);
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  rootStyle.setProperty("--alpha-primary", boost(0.90, 1));
  rootStyle.setProperty("--alpha-secondary", boost(0.60, 1));
  rootStyle.setProperty("--alpha-muted", boost(0.42, 1));
  rootStyle.setProperty("--alpha-disabled", boost(0.26, 0.50));
  rootStyle.setProperty("--alpha-border-strong", boost(0.16, 0.50));
  rootStyle.setProperty("--alpha-border-subtle", boost(0.08, 0.24));
  rootStyle.setProperty("--alpha-slider", boost(dark ? 0.95 : 0.62, 1));
  rootStyle.setProperty("--alpha-slider-rest", boost(dark ? 0.30 : 0.20, 0.45));
}
function opacityTick() {
  opacityShown += (opacityTarget - opacityShown) * 0.3;
  if (Math.abs(opacityTarget - opacityShown) < 0.002) opacityShown = opacityTarget;
  paintOpacity(opacityShown);
  opacityRaf = opacityShown === opacityTarget ? 0 : requestAnimationFrame(opacityTick);
}
function applyOpacity(rawValue) {
  const num = Number(rawValue);
  opacityTarget = num / 100;
  const pct = ((num - Number(opacitySlider.min)) / (Number(opacitySlider.max) - Number(opacitySlider.min))) * 100;
  opacitySlider.style.setProperty("--opacity-pct", `${pct.toFixed(1)}%`);
  if (opacityShown === null) { opacityShown = opacityTarget; paintOpacity(opacityShown); return; }
  if (!opacityRaf) opacityRaf = requestAnimationFrame(opacityTick);
}
opacitySlider.addEventListener("input", e => applyOpacity(e.target.value));
// Persist on release (the input event fires continuously while dragging).
opacitySlider.addEventListener("change", saveUiPrefs);
applyOpacity(opacitySlider.value);

// Frameless window controls, drag and edge resize transitions.
if (window.__TAURI_INTERNALS__) {
  const nativeWindow = getCurrentWindow();
  const windowsBackdrop = /Windows/i.test(navigator.userAgent);
  const restoreFluentSurface = () => document.body.classList.remove("window-solid-drag");
  listen("window-move-finished", () => restoreFluentSurface());
  const startNativeMove = async (kind, direction) => {
    document.body.classList.add("window-solid-drag");
    try {
      await invoke(kind === "resize" ? "begin_window_resize" : "begin_window_drag", direction ? { direction } : {});
    } catch (error) {
      console.error("Could not start native window movement:", error);
      restoreFluentSurface();
      if (kind === "resize") await nativeWindow.startResizeDragging(direction);
      else await nativeWindow.startDragging();
    }
  };
  document.getElementById("btnMinimize").addEventListener("click", () => nativeWindow.minimize());
  document.getElementById("btnMaximize").addEventListener("click", () => nativeWindow.toggleMaximize());
  document.getElementById("btnCloseWindow").addEventListener("click", () => nativeWindow.close());
  // Round the whole native window on macOS (the page surface AND the frosted
  // layer behind it) to the system corner radius; maximized = square, like
  // native windows. A CSS radius alone leaves the square backdrop showing.
  const syncCornerRadius = async () => {
    if (!document.body.classList.contains("is-mac")) return;
    try {
      const maximized = await nativeWindow.isMaximized();
      document.body.classList.toggle("window-maximized", maximized);
      await invoke("set_window_corner_radius", { radius: maximized ? 0 : 16 });
    } catch (error) {
      console.error("Could not set window corner radius:", error);
    }
  };
  syncCornerRadius();
  nativeWindow.onResized?.(syncCornerRadius);
  // macOS traffic lights (visible only on Mac) mirror the Windows controls.
  document.getElementById("btnMacClose").addEventListener("click", () => nativeWindow.close());
  document.getElementById("btnMacMinimize").addEventListener("click", () => nativeWindow.minimize());
  document.getElementById("btnMacMaximize").addEventListener("click", () => nativeWindow.toggleMaximize());
  const autoStartButton = document.getElementById("btnAutoStart");
  const refreshAutoStartButton = async () => {
    try {
      const enabled = await invoke("get_autostart_state");
      autoStartButton.classList.toggle("active", enabled);
      autoStartButton.title = enabled ? "已开启开机自启动" : "开启开机自启动";
      autoStartButton.setAttribute("aria-pressed", String(enabled));
    } catch (error) { console.error("Could not read auto-start setting:", error); }
  };
  autoStartButton.addEventListener("click", async () => {
    const enable = !autoStartButton.classList.contains("active");
    try {
      await invoke("set_autostart_state", { enabled: enable });
      await refreshAutoStartButton();
      showToast(enable ? "已开启开机自启动" : "已关闭开机自启动");
    } catch (error) {
      console.error("Could not update auto-start setting:", error);
      showToast("修改自启动设置失败");
    }
  });
  refreshAutoStartButton();
  document.querySelector(".titlebar").addEventListener("pointerdown", event => {
    if (event.button !== 0 || event.target.closest("button, input, select, a")) return;
    event.preventDefault();
    if (windowsBackdrop) startNativeMove("drag");
    else nativeWindow.startDragging();
  });
  if (windowsBackdrop) {
    const edge = 7;
    const resizeDirections = {
      "North": "ns-resize", "South": "ns-resize", "East": "ew-resize", "West": "ew-resize",
      "NorthWest": "nwse-resize", "SouthEast": "nwse-resize", "NorthEast": "nesw-resize", "SouthWest": "nesw-resize"
    };
    document.addEventListener("pointermove", event => {
      if (event.buttons) return;
      const x = event.clientX, y = event.clientY, w = innerWidth, h = innerHeight;
      const north = y < edge, south = y >= h - edge, west = x < edge, east = x >= w - edge;
      const direction = north && west ? "NorthWest" : north && east ? "NorthEast" : south && west ? "SouthWest" : south && east ? "SouthEast" : north ? "North" : south ? "South" : west ? "West" : east ? "East" : null;
      document.documentElement.style.cursor = direction ? resizeDirections[direction] : "";
    });
    document.addEventListener("pointerdown", event => {
      if (event.button !== 0 || event.target.closest("button, input, select, textarea, a, [contenteditable='true']")) return;
      const x = event.clientX, y = event.clientY, w = innerWidth, h = innerHeight;
      const north = y < edge, south = y >= h - edge, west = x < edge, east = x >= w - edge;
      const direction = north && west ? "NorthWest" : north && east ? "NorthEast" : south && west ? "SouthWest" : south && east ? "SouthEast" : north ? "North" : south ? "South" : west ? "West" : east ? "East" : null;
      if (!direction) return;
      event.preventDefault();
      event.stopPropagation();
      startNativeMove("resize", direction);
    }, true);
  }
}

// Responsive squeeze, two thresholds: titlebar labels never wrap (CSS
// nowrap) — when the window gets narrower than TITLEBAR_NARROW_THRESHOLD
// the labels hide (auto-narrow). The sidebar holds on longer and only
// auto-collapses under the smaller SIDEBAR_NARROW_THRESHOLD. Widening
// restores the labels — and the sidebar too, but only when it was the
// narrowing that hid it (a manual collapse stays).
const TITLEBAR_NARROW_THRESHOLD = 680;
const SIDEBAR_NARROW_THRESHOLD = 620;
let wasSidebarNarrow = false;
let sidebarAutoCollapsed = false;
function applyResponsiveLayout() {
  const w = window.innerWidth;
  appWindow.classList.toggle("auto-narrow", w < TITLEBAR_NARROW_THRESHOLD);
  const sbNarrow = w < SIDEBAR_NARROW_THRESHOLD;
  appWindow.classList.toggle("sidebar-locked", sbNarrow);
  if (sbNarrow && !wasSidebarNarrow && !appWindow.classList.contains("sidebar-collapsed")) {
    setSidebarCollapsed(true);
    sidebarAutoCollapsed = true;
  }
  if (!sbNarrow && wasSidebarNarrow && sidebarAutoCollapsed) {
    setSidebarCollapsed(false);
    sidebarAutoCollapsed = false;
  }
  wasSidebarNarrow = sbNarrow;
}
window.addEventListener("resize", applyResponsiveLayout);
applyResponsiveLayout();

const THEME_LABELS = { system: "跟随系统", light: "浅色", dark: "深色" };

// ---------- Sections: create / delete ----------
function createSection(name) {
  const clean = (name || "").replace(/^#+\s*/, "").trim();
  if (!clean) { showToast("分类名不能为空"); return false; }
  const { sections } = parseMarkdown(rawContent);
  if (clean === "未分类" || sections.some(s => s.name === clean)) { showToast("已存在同名分类"); return false; }
  const base = rawContent.replace(/\n+$/, "");
  saveToMarkdownFile((base ? base + "\n\n" : "") + `# ${clean}\n`, "已新建分类");
  showToast(`已新建分类 # ${clean}`);
  enterSection(clean);
  return true;
}

function deleteSection(name) {
  const { sections, lines } = parseMarkdown(rawContent);
  const sec = sections.find(s => s.name === name);
  if (!sec) return;
  const removed = lines[sec.lineIndex];
  lines.splice(sec.lineIndex, 1);
  if (currentSection === name) exitToGlobal("all");
  saveToMarkdownFile(lines.join("\n"), "已删除分类");
  showToast(`已删除分类 # ${name}，里面的待办保留并归入相邻分类`, {
    label: "撤销",
    onClick: () => { restoreLine(sec.lineIndex, removed); showToast(`已恢复分类 # ${name}`); }
  });
}

// ---------- Drag & drop reordering ----------
// Press-and-hold (180ms) or a deliberate 10px move picks the card up: a
// floating copy follows the pointer, a dashed placeholder marks the drop
// slot and slides between cards AND sections (siblings FLIP out of the
// way). Dropping rewrites the .md lines; a parent task carries its whole
// subtask block along.
function taskBlockRange(parsed, lineIndex) {
  const t = parsed.tasks.find(x => x.lineIndex === lineIndex);
  if (!t) return [lineIndex, lineIndex];
  const depthOf = x => (x.indent ? x.indent.length : 0);
  let end = lineIndex;
  const after = parsed.tasks.filter(x => x.lineIndex > lineIndex).sort((a, b) => a.lineIndex - b.lineIndex);
  for (const x of after) {
    if (parsed.sections.some(s => s.lineIndex > lineIndex && s.lineIndex < x.lineIndex)) break;
    if (depthOf(x) > depthOf(t)) end = x.lineIndex; else break;
  }
  return [lineIndex, end];
}

let dragArm = null;
let dragCtx = null;
let suppressClickUntil = 0;

taskListContainer.addEventListener("pointerdown", e => {
  if (e.button !== 0 || dragCtx) return;
  const card = e.target.closest(".task-card");
  if (!card || card.dataset.lineIndex == null) return;
  if (e.target.closest(".fluent-checkbox, .task-actions, button, input, textarea, select, a")) return;
  if (card.querySelector(".task-edit-input")) return;
  dragArm = { lineIndex: Number(card.dataset.lineIndex), startX: e.clientX, startY: e.clientY, held: false };
  const arm = dragArm;
  setTimeout(() => { if (dragArm === arm) arm.held = true; }, 180);
});

window.addEventListener("pointermove", e => {
  if (dragCtx) { moveDrag(e); return; }
  if (!dragArm) return;
  const dist = Math.hypot(e.clientX - dragArm.startX, e.clientY - dragArm.startY);
  // A click must never turn into a drag by accident: an unheld press needs a
  // deliberate 10px move, and even an armed (held 180ms) press still needs
  // 4px — releasing a still or barely-jittered press stays a click and
  // enters edit mode, every time.
  if (dist > (dragArm.held ? 4 : 10)) startDrag(e);
});

window.addEventListener("pointerup", () => {
  if (dragCtx) finishDrag();
  dragArm = null;
});
window.addEventListener("pointercancel", () => {
  if (dragCtx) cancelDrag();
  dragArm = null;
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && dragCtx) { cancelDrag(); dragArm = null; }
});

// Swallow the click that follows a drag so it doesn't open the editor.
taskListContainer.addEventListener("click", e => {
  if (Date.now() < suppressClickUntil) { e.stopPropagation(); e.preventDefault(); }
}, true);

// Clicking a card (anywhere except the checkbox and the star/edit/delete
// buttons) enters edit mode — ONE click, always. Delegated on the container
// and resolved from the pointer position: when the previous edit commits on
// blur it re-renders the list mid-click, detaching the mousedown target, so
// a per-card listener never sees that click (it lands on the container) and
// the user had to click twice. Hit-testing by coordinates still finds the
// card the user actually aimed at.
taskListContainer.addEventListener("click", e => {
  let pt = null;
  try { pt = document.elementFromPoint(e.clientX, e.clientY); } catch { pt = null; }
  if (pt && pt.closest(".fluent-checkbox, .task-actions")) return;
  if (e.target.closest && e.target.closest(".fluent-checkbox, .task-actions")) return;
  const card = (pt && pt.closest(".task-card")) || (e.target.closest && e.target.closest(".task-card"));
  if (!card || card.dataset.lineIndex == null) return;
  if (card.querySelector(".task-edit-input")) return;
  const lineIndex = Number(card.dataset.lineIndex);
  if (editingLineIndex === lineIndex) return;
  measureEditRows(card);
  editingLineIndex = lineIndex;
  renderApp();
});

function startDrag(e) {
  const parsed = parseMarkdown(rawContent);
  const [start, end] = taskBlockRange(parsed, dragArm.lineIndex);
  const blockCards = [...taskListContainer.querySelectorAll(".task-card")]
    .filter(c => { const li = Number(c.dataset.lineIndex); return li >= start && li <= end; });
  if (!blockCards.length) { dragArm = null; return; }
  const first = blockCards[0];
  const rect = first.getBoundingClientRect();
  const placeholder = document.createElement("div");
  placeholder.className = "drag-placeholder";
  placeholder.style.height = `${blockCards.reduce((h, c) => h + c.offsetHeight, 0) + 6 * (blockCards.length - 1)}px`;
  if (first.style.marginLeft) placeholder.style.marginLeft = first.style.marginLeft;
  first.parentNode.insertBefore(placeholder, first);
  blockCards.forEach(c => c.classList.add("drag-source"));
  const clone = document.createElement("div");
  clone.className = "drag-clone";
  blockCards.forEach(c => {
    const n = c.cloneNode(true);
    n.classList.remove("drag-source");
    clone.appendChild(n);
  });
  clone.style.width = `${rect.width}px`;
  clone.style.left = `${rect.left}px`;
  clone.style.top = `${rect.top}px`;
  document.body.appendChild(clone);
  dragCtx = {
    start, end, parsed, placeholder, clone, blockCards,
    grabDX: dragArm.startX - rect.left,
    grabDY: dragArm.startY - rect.top
  };
  document.body.classList.add("dragging");
  moveDrag(e);
}

function moveDrag(e) {
  const ctx = dragCtx;
  if (!ctx) return;
  ctx.clone.style.left = `${e.clientX - ctx.grabDX}px`;
  ctx.clone.style.top = `${e.clientY - ctx.grabDY}px`;
  const cRect = taskListContainer.getBoundingClientRect();
  if (e.clientY < cRect.top + 56) taskListContainer.scrollTop -= 12;
  else if (e.clientY > cRect.bottom - 56) taskListContainer.scrollTop += 12;
  const els = [...taskListContainer.children].filter(el =>
    (el.classList.contains("task-card") && !el.classList.contains("drag-source")) ||
    el.classList.contains("section-group-header"));
  let target = null;
  for (const el of els) {
    const r = el.getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { target = el; break; }
  }
  const ph = ctx.placeholder;
  if (target) {
    if (ph.nextElementSibling !== target || ph.parentNode !== taskListContainer) {
      if (target.previousElementSibling !== ph) flipCards(() => taskListContainer.insertBefore(ph, target));
    }
  } else if (ph !== taskListContainer.lastElementChild) {
    flipCards(() => taskListContainer.appendChild(ph));
  }
}

function computeDropContent(ctx) {
  const { parsed, start, end, placeholder } = ctx;
  const lines = parsed.lines;
  const block = lines.slice(start, end + 1);
  const rest = lines.filter((_, i) => i < start || i > end);
  const siblings = [...taskListContainer.children];
  const phIdx = siblings.indexOf(placeholder);
  const isAnchor = el => !el.classList.contains("drag-source") && !el.classList.contains("section-add-row");
  let prevEl = null, nextCard = null;
  for (let i = phIdx - 1; i >= 0; i--) if (isAnchor(siblings[i])) { prevEl = siblings[i]; break; }
  for (let i = phIdx + 1; i < siblings.length; i++) {
    if (!isAnchor(siblings[i])) continue;
    if (siblings[i].classList.contains("task-card")) { nextCard = siblings[i]; break; }
    if (siblings[i].classList.contains("section-group-header")) break;
  }
  const taskByLine = new Map(parsed.tasks.map(t => [t.lineIndex, t]));
  let insertBefore;
  if (prevEl && prevEl.classList.contains("section-group-header")) {
    const secName = prevEl.dataset.sectionName;
    const nextTask = nextCard ? taskByLine.get(Number(nextCard.dataset.lineIndex)) : null;
    if (nextTask && nextTask.section === secName) {
      insertBefore = nextTask.lineIndex;
    } else {
      const sec = parsed.sections.find(s => s.name === secName);
      insertBefore = sec ? sec.lineIndex + 1 : (nextCard ? Number(nextCard.dataset.lineIndex) : lines.length);
    }
  } else if (nextCard) {
    insertBefore = Number(nextCard.dataset.lineIndex);
  } else if (prevEl && prevEl.classList.contains("task-card")) {
    insertBefore = taskBlockRange(parsed, Number(prevEl.dataset.lineIndex))[1] + 1;
  } else {
    insertBefore = lines.length;
  }
  const removedBefore = insertBefore <= start ? 0 : insertBefore > end ? block.length : insertBefore - start;
  const idx = insertBefore - removedBefore;
  if (idx === start) return null;
  rest.splice(idx, 0, ...block);
  return rest.join("\n");
}

function cleanupDrag() {
  if (!dragCtx) return;
  dragCtx.clone.remove();
  dragCtx.placeholder.remove();
  dragCtx.blockCards.forEach(c => c.classList.remove("drag-source"));
  document.body.classList.remove("dragging");
  dragCtx = null;
}

function finishDrag() {
  const ctx = dragCtx;
  const newContent = computeDropContent(ctx);
  cleanupDrag();
  if (newContent != null && newContent !== rawContent) {
    // Only a drag that actually reorders swallows its trailing click;
    // picking a card up and putting it back leaves the click intact,
    // so it can still enter edit mode.
    suppressClickUntil = Date.now() + 250;
    saveToMarkdownFile(newContent, "已重新排序");
  } else {
    renderApp();
  }
}

function cancelDrag() {
  cleanupDrag();
  suppressClickUntil = Date.now() + 250;
  renderApp();
}

// Restore the remembered UI prefs (theme mode + opacity) first, then the
// last selected document through Rust: Tauri's file-dialog scope is temporary
// and does not grant the previous file path again after an app restart.
if (window.__TAURI_INTERNALS__) {
  (async () => {
    try {
      const uiState = await invoke("get_ui_state");
      if (uiState) {
        if (THEME_CYCLE.includes(uiState.theme)) themeMode = uiState.theme;
        if (typeof uiState.opacity === "number" && uiState.opacity >= Number(opacitySlider.min) && uiState.opacity <= Number(opacitySlider.max)) {
          opacitySlider.value = uiState.opacity;
          applyOpacity(uiState.opacity);
        }
        if (typeof uiState.hide_completed === "boolean") hideCompletedTasks = uiState.hide_completed;
        if (typeof uiState.quick_section === "string") restoredQuickSection = uiState.quick_section;
        if (typeof uiState.always_on_top === "boolean") {
          alwaysOnTop = uiState.always_on_top;
          syncPinButton();
        }
      }
    } catch (error) {
      console.error("Could not restore UI prefs:", error);
    }
    applyTheme();
    try {
      const legacyPath = localStorage.getItem("fluent-md-todo:last-file");
      if (legacyPath) {
        await invoke("remember_md_file", { path: legacyPath });
        localStorage.removeItem("fluent-md-todo:last-file");
      }
      const lastFile = await invoke("read_last_md_file");
      if (lastFile) {
        currentFilePath = lastFile.path;
        rawContent = lastFile.content;
        resetHistory();
        fileNameLabel.textContent = getFileName(lastFile.path);
        syncStatusText.textContent = `实时监听中 · ${new Date().toLocaleTimeString()}`;
      }
    } catch (error) {
      console.error("Could not restore the last Markdown file:", error);
      showToast("上次的 Markdown 文件无法读取，请重新选择一次");
    } finally {
      renderApp();
    }
  })();
} else {
  applyTheme();
  renderApp();
}
</script>
