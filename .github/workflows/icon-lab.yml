name: icon-lab

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then sudo xcode-select -s "$LATEST_XCODE"; fi
          xcodebuild -version
      - name: Compile REAL icon, export icns for eyeball check
        run: |
          set +e
          rm -rf /tmp/out-real && mkdir -p /tmp/out-real /tmp/previews
          xcrun actool src-tauri/AppIcon.icon --compile /tmp/out-real --app-icon AppIcon --target-device mac --platform macosx --minimum-deployment-target 26.0 --output-partial-info-plist /tmp/out-real.plist
          echo "actool exit: $?"
          cp /tmp/out-real/AppIcon.icns /tmp/previews/AppIcon.icns
          assetutil --info /tmp/out-real/Assets.car > /tmp/info-real.json 2>/dev/null
          python3 - <<'PYEOF'
          import json
          data = json.load(open("/tmp/info-real.json"))
          for e in data:
              if e.get("AssetType") == "IconGroup":
                  ly = e["Layers"][0]
                  print("GROUP", e.get("Appearance"), "layer size:", ly.get("LayerSize"))
              if e.get("AssetType") == "IconImageStack":
                  print("STACK", e.get("Appearance"), "bg:", e["Layers"][0].get("Name"))
          PYEOF
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-previews
          path: /tmp/previews
          if-no-files-found: ignore
