name: icon-lab

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then sudo xcode-select -s "$LATEST_XCODE"; fi
          xcodebuild -version
          xcrun actool --version | head -3
      - name: Compile experiments - hand-authored .icon variants
        run: |
          set +e
          ASSETS=src-tauri/AppIcon.xcassets/AppIcon.appiconset
          mk() {
            rm -rf "/tmp/ic-$1" && mkdir -p "/tmp/ic-$1/AppIcon.icon/Assets"
            cp "$ASSETS/icon-512x512@2x.png" "/tmp/ic-$1/AppIcon.icon/Assets/glyph.png"
            cp "$ASSETS/icon-512x512@2x-dark.png" "/tmp/ic-$1/AppIcon.icon/Assets/glyph-dark.png"
            cp "$2" "/tmp/ic-$1/AppIcon.icon/icon.json"
          }
          cat > /tmp/c1.json <<'JSON'
          {
            "fill": { "solid": "extended-srgb:0.200,0.600,1.000,1.000" },
            "groups": [
              { "layers": [ { "image-name": "glyph.png", "name": "glyph" } ],
                "shadow": { "kind": "neutral", "opacity": 0.5 },
                "translucency": { "enabled": false, "value": 0.5 } }
            ],
            "supported-platforms": { "squares": "shared" },
            "version": 1
          }
          JSON
          cat > /tmp/c2.json <<'JSON'
          {
            "fill": { "solid": "extended-srgb:0.200,0.600,1.000,1.000" },
            "fill-specializations": [
              { "appearance": "dark", "value": { "solid": "extended-srgb:0.020,0.050,0.100,1.000" } }
            ],
            "groups": [
              { "layers": [ { "image-name": "glyph.png", "name": "glyph" } ],
                "shadow": { "kind": "neutral", "opacity": 0.5 },
                "translucency": { "enabled": false, "value": 0.5 } }
            ],
            "supported-platforms": { "squares": "shared" },
            "version": 1
          }
          JSON
          cat > /tmp/c3.json <<'JSON'
          {
            "fill": { "solid": "extended-srgb:0.200,0.600,1.000,1.000" },
            "groups": [
              { "layers": [
                  { "image-name": "glyph.png",
                    "image-name-specializations": [
                      { "appearance": "dark", "value": "glyph-dark.png" }
                    ],
                    "name": "glyph" }
                ],
                "shadow": { "kind": "neutral", "opacity": 0.5 },
                "translucency": { "enabled": false, "value": 0.5 } }
            ],
            "supported-platforms": { "squares": "shared" },
            "version": 1
          }
          JSON
          cat > /tmp/c4.json <<'JSON'
          {
            "fill": { "automatic-gradient": "extended-srgb:0.510,0.760,0.940,1.000" },
            "fill-specializations": [
              { "appearance": "dark", "value": { "automatic-gradient": "extended-srgb:0.050,0.100,0.160,1.000" } }
            ],
            "groups": [
              { "layers": [
                  { "image-name": "glyph.png",
                    "image-name-specializations": [
                      { "appearance": "dark", "value": "glyph-dark.png" }
                    ],
                    "name": "glyph" }
                ],
                "shadow": { "kind": "neutral", "opacity": 0.5 },
                "translucency": { "enabled": false, "value": 0.5 } }
            ],
            "supported-platforms": { "squares": "shared" },
            "version": 1
          }
          JSON
          for C in c1 c2 c3 c4; do
            mk "$C" "/tmp/$C.json"
            echo "================ $C (bundle as input) ================"
            rm -rf "/tmp/out-$C" && mkdir -p "/tmp/out-$C"
            xcrun actool "/tmp/ic-$C/AppIcon.icon" --compile "/tmp/out-$C" --app-icon AppIcon --target-device mac --platform macosx --minimum-deployment-target 26.0 --output-partial-info-plist "/tmp/out-$C.plist"
            echo "actool exit: $?"
            ls -la "/tmp/out-$C"
            echo "dark strings in $C car:"
            strings "/tmp/out-$C/Assets.car" 2>/dev/null | grep -ci dark
            echo "rendition names in $C car:"
            strings "/tmp/out-$C/Assets.car" 2>/dev/null | grep -E "glyph|\.png" | sort -u | head -20
          done
