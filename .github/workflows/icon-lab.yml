name: icon-lab

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then sudo xcode-select -s "$LATEST_XCODE"; fi
          xcodebuild -version
      - name: ictool argument recon
        run: |
          ICTOOL="$(xcode-select -p)/usr/bin/ictool"
          echo "== dash args =="
          strings "$ICTOOL" | grep -E "^--[a-z-]+$" | sort -u | head -60
          echo "== keyword strings =="
          strings "$ICTOOL" | grep -iE "rendition|appearance|output|usage" | sort -u | head -40
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-previews
          path: /tmp/previews
          if-no-files-found: ignore
