name: icon-lab

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then sudo xcode-select -s "$LATEST_XCODE"; fi
          xcodebuild -version
          xcrun actool --version | head -3
      - name: ictool render attempts
        run: |
          set +e
          ICTOOL="$(xcode-select -p)/usr/bin/ictool"
          "$ICTOOL" --help 2>&1 | head -60
          echo "===== try renders ====="
          mkdir -p /tmp/previews
          "$ICTOOL" src-tauri/AppIcon.icon --out /tmp/previews --size 512 2>&1 | head -10
          ls -la /tmp/previews
          find /tmp/previews -type f | head -20
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-previews
          path: /tmp/previews
          if-no-files-found: ignore

        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-real-output
          path: |
            /tmp/out-real/Assets.car
            /tmp/out-real/AppIcon.icns
          if-no-files-found: ignore
