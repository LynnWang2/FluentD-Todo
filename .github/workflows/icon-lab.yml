name: icon-lab

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then sudo xcode-select -s "$LATEST_XCODE"; fi
          xcodebuild -version
          xcrun actool --version | head -3
      - name: Recon 3 - schema keys inside actool binaries
        run: |
          echo "== actool real path =="
          xcrun -f actool || true
          echo "== candidate binaries =="
          ls "$(xcode-select -p)/usr/bin" | grep -i -E "actool|ibtool|icon" || true
          echo "== strings: specialization / appearance keys =="
          for B in "$(xcrun -f actool)" "$(xcode-select -p)/usr/bin/ibtoold"; do
            echo "-- $B"
            strings "$B" 2>/dev/null | grep -i "specialization" | sort -u | head -20 || true
          done
          echo "== strings: icon.json top-level keys (framework) =="
          FW=$(find "$(xcode-select -p)/.." -name "AssetCatalogFoundation.framework" -maxdepth 6 2>/dev/null | head -1)
          echo "framework: $FW"
          if [ -n "$FW" ]; then
            BIN=$(find "$FW" -type f -perm -111 | head -1)
            echo "binary: $BIN"
            strings "$BIN" 2>/dev/null | grep -E "^(fill|groups|layers|supported-platforms|version|image-name|translucency|shadow|blend-mode|lighting|background)" | sort -u | head -40 || true
            echo "-- appearance values --"
            strings "$BIN" 2>/dev/null | grep -iE "^(dark|light|mono|tinted)$" | sort -u || true
          fi
          echo "== Icon Composer resources =="
          find "/Applications/Xcode_26.6.0.app/Contents/Applications/Icon Composer.app" -maxdepth 4 -type d | head -25 || true
      - name: Baseline A - current appiconset, deployment 11
        run: |
          rm -rf /tmp/expA && mkdir -p /tmp/expA
          xcrun actool src-tauri/AppIcon.xcassets --compile /tmp/expA --app-icon AppIcon --include-all-app-icons --target-device mac --platform macosx --minimum-deployment-target 11.0 --output-partial-info-plist /tmp/expA.plist || true
          echo "dark strings in A:"
          strings /tmp/expA/Assets.car 2>/dev/null | grep -ci dark || true
      - name: Baseline B - current appiconset, deployment 26
        run: |
          rm -rf /tmp/expB && mkdir -p /tmp/expB
          xcrun actool src-tauri/AppIcon.xcassets --compile /tmp/expB --app-icon AppIcon --include-all-app-icons --target-device mac --platform macosx --minimum-deployment-target 26.0 --output-partial-info-plist /tmp/expB.plist || true
          echo "dark strings in B:"
          strings /tmp/expB/Assets.car 2>/dev/null | grep -ci dark || true
          echo "rendition names in B:"
          strings /tmp/expB/Assets.car 2>/dev/null | grep -E "^icon-" | sort -u || true
