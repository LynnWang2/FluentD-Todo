name: icon-lab

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then sudo xcode-select -s "$LATEST_XCODE"; fi
          xcodebuild -version
          xcrun actool --version | head -3
      - name: Compile + stack-level diff (red-fill trick)
        run: |
          set +e
          ASSETS=src-tauri/AppIcon.xcassets/AppIcon.appiconset
          mk() {
            rm -rf "/tmp/ic-$1" && mkdir -p "/tmp/ic-$1/AppIcon.icon/Assets"
            cp "$ASSETS/icon-512x512@2x.png" "/tmp/ic-$1/AppIcon.icon/Assets/glyph.png"
            cp "$ASSETS/icon-512x512@2x-dark.png" "/tmp/ic-$1/AppIcon.icon/Assets/glyph-dark.png"
            cp "$2" "/tmp/ic-$1/AppIcon.icon/icon.json"
          }
          cat > /tmp/c1.json <<'JSON'
          {
            "fill": { "solid": "extended-srgb:0.000,0.000,1.000,1.000" },
            "groups": [
              { "layers": [ { "image-name": "glyph.png", "name": "glyph" } ],
                "shadow": { "kind": "neutral", "opacity": 0.5 },
                "translucency": { "enabled": false, "value": 0.5 } }
            ],
            "supported-platforms": { "squares": "shared" },
            "version": 1
          }
          JSON
          cat > /tmp/c5.json <<'JSON'
          {
            "fill": { "solid": "extended-srgb:0.000,0.000,1.000,1.000" },
            "fill-specializations": [
              { "appearance": "dark", "value": { "solid": "extended-srgb:1.000,0.000,0.000,1.000" } }
            ],
            "groups": [
              { "layers": [
                  { "image-name": "glyph.png",
                    "image-name-specializations": [
                      { "appearance": "dark", "value": "glyph-dark.png" }
                    ],
                    "name": "glyph" }
                ],
                "shadow": { "kind": "neutral", "opacity": 0.5 },
                "translucency": { "enabled": false, "value": 0.5 } }
            ],
            "supported-platforms": { "squares": "shared" },
            "version": 1
          }
          JSON
          for C in c1 c5; do
            mk "$C" "/tmp/$C.json"
            rm -rf "/tmp/out-$C" && mkdir -p "/tmp/out-$C"
            xcrun actool "/tmp/ic-$C/AppIcon.icon" --compile "/tmp/out-$C" --app-icon AppIcon --target-device mac --platform macosx --minimum-deployment-target 26.0 --output-partial-info-plist "/tmp/out-$C.plist" > /dev/null 2>&1
            assetutil --info "/tmp/out-$C/Assets.car" > "/tmp/info-$C.json" 2>/dev/null
          done
          python3 - <<'PYEOF'
          import json
          def load(p):
              return json.load(open(p))
          for tag, path in (("C1", "/tmp/info-c1.json"), ("C5", "/tmp/info-c5.json")):
              data = load(path)
              print(f"######## {tag}: {len(data)} entries")
              for e in data:
                  keys = set(e.keys())
                  if "Appearances" in keys:
                      print("HEADER Appearances:", e["Appearances"])
                  if "Color components" in keys:
                      print("COLOR:", e.get("Name"), e.get("Color components"), e.get("Colorspace"))
                  if e.get("RenditionName", "").endswith((".iconstack",)) or e.get("RenditionName") == "IconGroup" or "Appearance" in keys:
                      keep = {k: v for k, v in e.items() if k in ("Name", "RenditionName", "Appearance", "LayerCount", "Layers", "Template Mode", "AssetType")}
                      print("STACK/APP:", json.dumps(keep)[:600])
          PYEOF
