name: icon-lab

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then sudo xcode-select -s "$LATEST_XCODE"; fi
          xcodebuild -version
          xcrun actool --version | head -3
      - name: Recon 2 - Icon Composer app, deeper search
        run: |
          XC=/Applications/Xcode_26.6.0.app
          echo "== Contents/Applications =="
          ls "$XC/Contents/Applications" || true
          echo "== find composer (bounded) =="
          find "$XC/Contents" -maxdepth 3 -iname "*composer*" 2>/dev/null | head || true
          echo "== .icon bundles inside Icon Composer (deep) =="
          find "$XC/Contents/Applications" -name "*.icon" 2>/dev/null | head -10 || true
          echo "== icon.json anywhere in Xcode apps dir (deep) =="
          find "$XC/Contents/Applications" -name "icon.json" 2>/dev/null | head -5 || true
          echo "== icon-related tools =="
          ls "$(xcode-select -p)/usr/bin" | grep -i icon || true
          find "$(xcode-select -p)/usr/bin" -iname "*icon*" 2>/dev/null | head || true
          echo "== actool help (icon mentions) =="
          xcrun actool --help 2>&1 | grep -i -A2 -B2 "icon" | head -60 || true
      - name: Dump sample icon.json (deep find)
        run: |
          SAMPLE=$(find /Applications/Xcode_26.6.0.app/Contents/Applications -name "icon.json" 2>/dev/null | head -1)
          echo "sample: $SAMPLE"
          if [ -n "$SAMPLE" ]; then
            cat "$SAMPLE"
            echo "== bundle layout =="
            find "$(dirname "$SAMPLE")" -type f | head -40
          fi
      - name: Baseline A - current appiconset, deployment 11
        run: |
          rm -rf /tmp/expA && mkdir -p /tmp/expA
          xcrun actool src-tauri/AppIcon.xcassets --compile /tmp/expA --app-icon AppIcon --include-all-app-icons --target-device mac --platform macosx --minimum-deployment-target 11.0 --output-partial-info-plist /tmp/expA.plist || true
          echo "dark strings in A:"
          strings /tmp/expA/Assets.car 2>/dev/null | grep -ci dark || true
      - name: Baseline B - current appiconset, deployment 26
        run: |
          rm -rf /tmp/expB && mkdir -p /tmp/expB
          xcrun actool src-tauri/AppIcon.xcassets --compile /tmp/expB --app-icon AppIcon --include-all-app-icons --target-device mac --platform macosx --minimum-deployment-target 26.0 --output-partial-info-plist /tmp/expB.plist || true
          echo "dark strings in B:"
          strings /tmp/expB/Assets.car 2>/dev/null | grep -ci dark || true
          echo "rendition names in B:"
          strings /tmp/expB/Assets.car 2>/dev/null | grep -E "^icon-" | sort -u || true
