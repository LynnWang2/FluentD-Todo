name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Compile macOS icon (Icon Composer .icon -> Assets.car)
        if: matrix.platform == 'macos-latest'
        run: |
          # macOS dark-mode app icons are authored as an Icon Composer
          # .icon bundle (src-tauri/AppIcon.icon): actool compiles it to
          # Assets.car with per-appearance icon stacks. The old
          # appiconset route silently dropped every dark rendition for
          # the mac idiom (shipped broken in v1.3.0/v1.3.1) - do not go
          # back to it. Requires Xcode 26's actool; pick the newest one.
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version
          xcrun actool --version
          xcrun actool src-tauri/AppIcon.icon \
            --compile src-tauri \
            --app-icon AppIcon \
            --target-device mac \
            --platform macosx \
            --minimum-deployment-target 26.0 \
            --output-partial-info-plist /tmp/appicon-partial.plist
          test -f src-tauri/Assets.car
          # Hard verification: the compiled car must contain a DarkAqua
          # stack whose gradient uses the dark artwork's colors
          # (#273D4D -> #020A11) and a distinct Aqua stack. Fail loudly
          # instead of shipping a light-only icon a third time.
          xcrun assetutil --info src-tauri/Assets.car > /tmp/car-info.json
          python3 - <<'PYEOF'
          import json, sys
          data = json.load(open("/tmp/car-info.json"))
          stacks = {}
          colors = []
          for e in data:
              if "Color components" in e and len(e["Color components"]) == 4:
                  colors.append(tuple(round(c, 3) for c in e["Color components"]))
              if e.get("AssetType") == "IconImageStack":
                  stacks[e.get("Appearance")] = e["Layers"][0].get("SHA1Digest")
          def has_color(target):
              return any(all(abs(a - b) < 0.01 for a, b in zip(c, target)) for c in colors)
          ok = True
          if "NSAppearanceNameDarkAqua" not in stacks:
              print("FAIL: no DarkAqua icon stack"); ok = False
          if "NSAppearanceNameAqua" not in stacks:
              print("FAIL: no Aqua icon stack"); ok = False
          if ok and stacks["NSAppearanceNameDarkAqua"] == stacks["NSAppearanceNameAqua"]:
              print("FAIL: dark and light stacks share the same background"); ok = False
          if not has_color((0.153, 0.239, 0.302, 1)):
              print("FAIL: dark gradient stop #273D4D missing"); ok = False
          if not has_color((0.008, 0.039, 0.067, 1)):
              print("FAIL: dark gradient stop #020A11 missing"); ok = False
          if not has_color((0.51, 0.761, 0.937, 1)):
              print("FAIL: light gradient stop #82C2EF missing"); ok = False
          print("icon stacks:", stacks)
          print("icon colors verified" if ok else "icon verification FAILED")
          sys.exit(0 if ok else 1)
          PYEOF
      - name: Wire Assets.car into the bundle config (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          jq '.bundle.resources = ["Assets.car"] | .bundle.macOS.infoPlist = "macos-Info.plist"' \
            src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Fluent MD Todo v__VERSION__"
          releaseBody: |
            Fluent MD Todo v1.3.1 更新：

            - 新增托盘驻留：关闭窗口只隐藏到 Windows 托盘 / macOS 菜单栏，点托盘图标即可重新打开，托盘菜单里可彻底退出；macOS 点 Dock 图标也能唤回窗口
            - macOS 菜单栏图标使用单色镂空模板图标，随菜单栏深浅自动变色
            - Windows 图标圆角与 macOS 对齐（22% 大圆角）
            - 「隐藏已完成 / 显示已完成」改为眼睛图标切换：睁眼 = 显示中，闭眼 = 已隐藏
            - 仓库 README 改为中文为主，英文版在 README.en.md，顶部可点击切换
            - 追加修正：修复 macOS 深色模式下 Dock 图标不切换深色版（打包工具把深色图标丢了，现已换新工具并加校验）；菜单栏图标缩小 15%
            - 追加修正：新建待办改为落在该分类的第一行；支持按住待办拖动排序（可跨分类拖放，子待办整块跟随，虚线占位提示落点）
            - 追加修正：托盘 / 菜单栏图标改为单击直接打开窗口，右键才弹菜单（打开 / 退出）
            - 追加修正：新增全局撤销 / 重做快捷键 Ctrl（Cmd）+Z / Ctrl（Cmd）+Shift+Z，覆盖增删、勾选、编辑、移动、排序等全部操作

            macOS：通用版（Apple Silicon + Intel）DMG，未签名，首次打开请右键点 App 选「打开」。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
