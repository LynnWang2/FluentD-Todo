name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Fluent MD Todo v__VERSION__"
          releaseBody: |
            Fluent MD Todo v1.1.0 更新：

            - 切换到某个章节时，底部新增待办会自动追加到该章节；切回全部视图恢复追加到文档末尾
            - 点击待办卡片（按钮区域除外）直接进入编辑；去掉待办上的行号标记
            - 「选择 .md 文件 / 新建 .md」收进左上角文件名：点文件名展开
            - 去蓝化：添加框底部蓝线去除，编辑框边框与完成勾选改为黑白灰，半透明滑杆改为黑白细线 + 小圆点
            - macOS：左上角红绿灯窗口按钮（原品牌区右移让位），右上角不再显示 Windows 风格按钮
            - 浅色模式下半透明拉到最高时窗口更白（深色模式不变）
            - 追加修正：文件名展开改为浮层下拉（覆盖窗口、不占行）；紧凑模式右上角按钮只留图标且半透明滑杆缩短；同步状态改为纯圆点
            - 追加修正：文件名下拉内两个按钮去掉多余边框，高度 / 图标 / 文字起始位统一对齐；已完成勾选的填充灰与完成文字同色

            macOS：通用版（Apple Silicon + Intel）DMG，未签名，首次打开请右键点 App 选「打开」。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
