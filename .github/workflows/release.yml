name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Fluent MD Todo v__VERSION__"
          releaseBody: |
            Fluent MD Todo v1.2.0 更新：

            - 全套过渡动画：切视图卡片错峰淡入、勾选后卡片平滑沉底、删除收拢消退、侧边栏滑动、面板弹出、主题渐变、启动淡入（跟随系统「减少动态效果」自动降级）
            - 分类管理：「待办分类」旁 + 新建分类；右键分类可新增/删除分类（删分类保留待办并归入相邻分类，可撤销）
            - 自定义右键菜单（屏蔽网页菜单，输入框里保留系统编辑菜单）：右键待办可新建待办 / 移动待办（弹窗选分类）/ 删除待办
            - 通知弹窗改到底部居中；删除待办的弹窗带可点击「撤销」，误删一键恢复
            - 自启动改看图标状态：未开启镂空火箭、开启实心火箭，按钮框线与底色不再变化
            - 圆角统一：源码编辑框、待办编辑框改 6px，与其他输入框一致
            - 包含 v1.1.0 全部改进（毛玻璃主题同步、原生窗口圆角、单按钮三档主题、已完成沉底、按类别进度等）

            macOS：通用版（Apple Silicon + Intel）DMG，未签名，首次打开请右键点 App 选「打开」。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
