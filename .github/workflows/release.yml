name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Fluent MD Todo v__VERSION__"
          releaseBody: |
            Fluent MD Todo v1.1.0 更新：

            - 切换到某个章节时，底部新增待办会自动追加到该章节；切回全部视图恢复追加到文档末尾
            - 点击待办卡片（按钮区域除外）直接进入编辑；去掉待办上的行号标记
            - 「选择 .md 文件 / 新建 .md」收进左上角文件名：点文件名展开
            - 去蓝化：添加框底部蓝线去除，编辑框边框与完成勾选改为黑白灰，半透明滑杆改为黑白细线 + 小圆点
            - macOS：左上角红绿灯窗口按钮（原品牌区右移让位），右上角不再显示 Windows 风格按钮
            - 不透明度拉到最高时窗口接近实色（两个模式统一）
            - 追加修正：文件名展开改为浮层下拉（覆盖窗口、不占行）；紧凑模式右上角按钮只留图标且半透明滑杆缩短；同步状态改为纯圆点
            - 追加修正：文件名下拉内两个按钮去掉多余边框，高度 / 图标 / 文字起始位统一对齐；已完成勾选的填充灰与完成文字同色
            - 不透明度曲线两模式统一（拉满近实色）；窗口最小宽度放开到 360
            - 新增待办默认目标改为「未分类」：写在文档最前面未分类待办之后
            - 小清理：侧栏去掉「(# 标题)」、搜索提示仅聚焦时显示、「半透明」改名「不透明度」
            - 修复 macOS 深色模式发灰：系统毛玻璃材质外观改为跟随 App 内主题同步（此前一直停在浅色）
            - 文件名与下拉两个按钮三统一：同宽、同高（32px）、同款样式
            - macOS 窗口圆角改为系统圆角（16px，最大化时恢复直角）
            - 毛玻璃垫层加冷色染色（随不透明度联动），滑动时颜色只变深浅不变冷暖
            - 紧凑按钮删除：其图标移到文件名左侧成为侧边栏开关；标题栏文字禁止换行，窗口窄于 740 时文字自动只留图标、侧边栏自动收起（拉宽不自动展开）
            - 窄窗口下进度计数自动隐藏；编辑框行数跟随标题换行数（两行标题开两行编辑框）
            - macOS 圆角改由原生窗口层裁剪（网页与毛玻璃一起圆，最大化恢复直角）；侧边栏开关开启态与文件名同款、窄窗口下锁定不可展开
            - 未分类进入侧栏章节列表；侧边栏收起时标题旁 ∨ 可下拉切换章节；窄窗口下品牌名自动隐藏避免右上按钮被裁切
            - 已完成待办自动沉到本类别最后；标题旁同步绿点去掉；进度行高度固定（计数隐藏不跳动），进度线改黑白灰（深色白/浅色深灰）
            - 不透明度圆点缩小 30%，浅色下圆点与填充线改深灰；添加栏 + 与文字同色
            - 主题改为一个按钮三档轮换：跟随系统 → 浅色（太阳）→ 深色（月亮）；自启动开启态改白/灰框、不用蓝色

            macOS：通用版（Apple Silicon + Intel）DMG，未签名，首次打开请右键点 App 选「打开」。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
