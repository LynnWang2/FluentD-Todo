name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Compile macOS icon appearance variants (Assets.car)
        if: matrix.platform == 'macos-latest'
        run: |
          xcrun actool src-tauri/AppIcon.xcassets \
            --compile src-tauri \
            --app-icon AppIcon \
            --include-all-app-icons \
            --target-device mac \
            --platform macosx \
            --minimum-deployment-target 11.0 \
            --output-partial-info-plist /tmp/appicon-partial.plist
          test -f src-tauri/Assets.car
      - name: Wire Assets.car into the bundle config (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          jq '.bundle.resources = ["Assets.car"] | .bundle.macOS.infoPlist = "macos-Info.plist"' \
            src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Fluent MD Todo v__VERSION__"
          releaseBody: |
            Fluent MD Todo v1.3.1 更新：

            - 新增托盘驻留：关闭窗口只隐藏到 Windows 托盘 / macOS 菜单栏，点托盘图标即可重新打开，托盘菜单里可彻底退出；macOS 点 Dock 图标也能唤回窗口
            - macOS 菜单栏图标使用单色镂空模板图标，随菜单栏深浅自动变色
            - Windows 图标圆角与 macOS 对齐（22% 大圆角）
            - 「隐藏已完成 / 显示已完成」改为眼睛图标切换：睁眼 = 显示中，闭眼 = 已隐藏
            - 仓库 README 改为中文为主，英文版在 README.en.md，顶部可点击切换

            macOS：通用版（Apple Silicon + Intel）DMG，未签名，首次打开请右键点 App 选「打开」。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
